[project]
name = "inventory"
version = "0.1.0"
description = "Garage storage-bin inventory: items, bins, check-out, visual search, label printing"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "pillow>=10.1",
  "qrcode>=7.4",
  "numpy>=1.26",
]

[project.optional-dependencies]
# Visual embeddings (CLIP via ONNX). Without these, search falls back to text
# only and grouping falls back to categories.
embed = ["onnxruntime>=1.17", "tokenizers>=0.15"]
# Claude-vision item identification.
claude = ["anthropic>=0.40"]

[project.scripts]
inventory-server = "inventory.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["inventory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
