[project]
name = "printd"
version = "0.1.0"
description = "Network print agent for a USB TSPL thermal label printer (KNAON Y813BT et al.)"
requires-python = ">=3.11"
dependencies = ["pillow>=10.1"]

[project.scripts]
printd = "printd.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["printd*"]
